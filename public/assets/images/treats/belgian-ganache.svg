<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A2511" />
      <stop offset="60%" stop-color="#261005" />
      <stop offset="100%" stop-color="#140602" />
    </radialGradient>
    <radialGradient id="truffleGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#6A381F" />
      <stop offset="45%" stop-color="#3D1C06" />
      <stop offset="85%" stop-color="#230E03" />
      <stop offset="100%" stop-color="#120601" />
    </radialGradient>
    <linearGradient id="berryDrizzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="60%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Platter -->
  <rect width="200" height="200" rx="36" fill="url(#darkBg)" />

  <!-- Shadow -->
  <ellipse cx="100" cy="155" rx="55" ry="14" fill="#0A0301" opacity="0.6" />

  <!-- Truffle Body -->
  <ellipse cx="100" cy="105" rx="52" ry="48" fill="url(#truffleGrad)" />

  <!-- Gloss Highlight -->
  <path d="M72 75 C80 65, 95 62, 108 64 C100 70, 88 74, 76 84 C73 80, 71 77, 72 75 Z" fill="#FFFFFF" opacity="0.25" />
  <circle cx="82" cy="74" r="5" fill="#FFFFFF" opacity="0.4" />

  <!-- Berry Ganache Drizzle -->
  <path d="M60 92 Q80 82 100 95 T140 92 Q120 110 95 116 T60 125 Q85 130 115 130 T145 125" fill="none" stroke="url(#berryDrizzle)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M68 93 Q85 85 102 96 T136 93" fill="none" stroke="#FF80AB" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Top Accent Curls -->
  <path d="M96 55 C92 48, 104 42, 108 48 C112 54, 102 60, 96 55 Z" fill="#D7CCC8" opacity="0.7" />
  <path d="M105 52 C108 45, 118 48, 115 54 C112 60, 106 58, 105 52 Z" fill="#BCAAA4" opacity="0.8" />
  <circle cx="122" cy="80" r="2.5" fill="#FFD54F" opacity="0.9" />
  <circle cx="70" cy="115" r="2" fill="#FFD54F" opacity="0.7" />
  <circle cx="130" cy="118" r="3" fill="#E91E63" opacity="0.8" />
</svg>

