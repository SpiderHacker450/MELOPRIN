<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rubyBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A1525" />
      <stop offset="60%" stop-color="#2B0A14" />
      <stop offset="100%" stop-color="#140208" />
    </radialGradient>
    <linearGradient id="rubyGradient" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF6B95" />
      <stop offset="40%" stop-color="#E91E63" />
      <stop offset="80%" stop-color="#AD1457" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA4BC" />
      <stop offset="100%" stop-color="#FF4081" />
    </linearGradient>
    <linearGradient id="goldCrunch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
  </defs>

  <!-- Background Platter -->
  <rect width="200" height="200" rx="36" fill="url(#rubyBg)" />

  <!-- Shadow -->
  <ellipse cx="100" cy="155" rx="55" ry="14" fill="#0A0205" opacity="0.6" />

  <!-- Geometric Ruby Bonbon Block -->
  <!-- Bottom Base -->
  <polygon points="55,115 100,145 145,115 100,90" fill="#880E4F" />
  
  <!-- Left Face -->
  <polygon points="55,115 100,145 100,105 55,75" fill="url(#rubyGradient)" />
  
  <!-- Right Face -->
  <polygon points="145,115 100,145 100,105 145,75" fill="#C2185B" />
  
  <!-- Top Face -->
  <polygon points="100,105 145,75 100,50 55,75" fill="url(#facetTop)" />

  <!-- Inner Gem Highlights -->
  <polygon points="100,100 135,76 100,56 65,76" fill="#FF80AB" opacity="0.6" />
  <polyline points="55,75 100,50 145,75" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
  <line x1="100" y1="50" x2="100" y2="105" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" />

  <!-- Praline Crunch Crystals & Gold Sprinkles -->
  <circle cx="85" cy="72" r="3" fill="url(#goldCrunch)" />
  <circle cx="112" cy="68" r="3.5" fill="url(#goldCrunch)" />
  <circle cx="98" cy="84" r="2.5" fill="#FFFFFF" />
  <circle cx="75" cy="95" r="2.5" fill="url(#goldCrunch)" />
  <circle cx="120" cy="92" r="3" fill="url(#goldCrunch)" />
  <circle cx="108" cy="125" r="2.5" fill="#FF80AB" opacity="0.9" />
  <circle cx="80" cy="122" r="2" fill="url(#goldCrunch)" />

  <!-- Sparkle Star -->
  <path d="M135 55 L138 48 L145 45 L138 42 L135 35 L132 42 L125 45 L132 48 Z" fill="#FFE082" />
</svg>

