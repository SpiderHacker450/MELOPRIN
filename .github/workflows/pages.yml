name: Deploy Countdown to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/countdown/**'
      - 'src/styles/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build public countdown
        run: npm run build
        env:
          PINKVERSE_BUILD_TARGET: public

      - name: Verify build artifact safety
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/launch-config.json || (echo "dist/launch-config.json missing" && exit 1)
          # Strict security verification: ensure no private directories exist in dist
          test ! -d dist/storage || (echo "CRITICAL: dist/storage found" && exit 1)
          test ! -d dist/all_pic || (echo "CRITICAL: dist/all_pic found" && exit 1)
          echo "Build artifact verified safe."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
